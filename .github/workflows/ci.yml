name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    name: Lint + tests + migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest -q
        env:
          # Tests build their own in-process SQLite via the Database fixture,
          # but the SetupCredentialsUseCase / SQLiteUserRepository constructors
          # need *some* Fernet key when constructed (even if specific tests
          # use a generated one). Set a placeholder so module import succeeds.
          SECRET_KEY: ""

      - name: Apply migrations to fresh DB
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db

      - name: Check no schema drift (model vs migration)
        run: uv run alembic check
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-check.db
