[project]
name = "medagent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=48.0.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "playwright>=1.59.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.28",
    "sqlalchemy[asyncio]>=2.0.49",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
]

[tool.ruff]
target-version = "py311"
exclude = [".env.example"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (common bugs)
    "UP",     # pyupgrade (modern syntax for py311+)
]
ignore = [
    "E501",   # line too long (delegate to formatter if used)
]

[tool.ruff.format]
quote-style = "double"
